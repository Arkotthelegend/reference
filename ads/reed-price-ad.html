<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REED price ad</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0B0F19; }
    .art {
      width: 1080px;
      height: 1080px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(240,185,11,0.28) 0%, rgba(240,185,11,0) 52%),
        radial-gradient(ellipse at 90% 80%, rgba(22,34,53,0.95) 0%, rgba(11,15,25,0) 55%),
        #0B0F19;
      color: #fff;
      font-family: Inter, "Noto Sans", Arial, sans-serif;
      padding: 72px 80px 64px;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #F0B90B;
      color: #0B0F19;
      font-weight: 800;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
    }
    .brand b {
      font-size: 28px;
      letter-spacing: 0.18em;
      font-weight: 800;
    }
    .kicker {
      margin: 28px 0 8px;
      color: #F0B90B;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 64px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    h1 span { color: #F0B90B; }
    .sub {
      margin: 0 0 36px;
      color: #94A3B8;
      font-size: 26px;
      font-weight: 600;
    }
    .card {
      flex: 1;
      background: linear-gradient(180deg, rgba(240,185,11,0.16) 0%, #162235 28%);
      border: 2px solid #F0B90B;
      border-radius: 36px;
      padding: 28px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 8px;
      border-bottom: 1px solid #1E293B;
    }
    .row:last-of-type { border-bottom: 0; }
    .row .term {
      color: #E2E8F0;
      font-size: 30px;
      font-weight: 700;
    }
    .row .amt {
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .row .amt small {
      font-size: 22px;
      font-weight: 700;
      color: #94A3B8;
      margin-left: 8px;
    }
    .row.best {
      background: rgba(240,185,11,0.12);
      border: 1px solid #F0B90B;
      border-radius: 18px;
      padding: 18px 20px;
      margin-top: 6px;
    }
    .row.best .term { color: #FCD535; }
    .row.best .amt { color: #F0B90B; }
    .foot {
      margin-top: 22px;
      text-align: center;
      color: #F0B90B;
      font-size: 24px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="art">
    <div class="brand"><div class="mark">R</div><b>REED</b></div>
    <div class="kicker">Grade 10 · 11 · 12</div>
    <h1>All subjects, <span>one pack</span></h1>
    <p class="sub">Same price for every grade</p>
    <div class="card">
      <div class="row"><span class="term">1 month</span><span class="amt">9,500<small>Ks</small></span></div>
      <div class="row"><span class="term">3 months</span><span class="amt">19,500<small>Ks</small></span></div>
      <div class="row"><span class="term">6 months</span><span class="amt">29,500<small>Ks</small></span></div>
      <div class="row best"><span class="term">13 months</span><span class="amt">34,500<small>Ks</small></span></div>
    </div>
    <div class="foot">Weekly timetable made by AI included</div>
  </div>
</body>
</html>
