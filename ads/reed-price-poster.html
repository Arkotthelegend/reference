<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REED price poster</title>
  <style>
    html, body { margin: 0; background: #070b14; }
    .art {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #070b14 url("./reed-ad-character-bg.png") left center / cover no-repeat;
      font-family: Inter, "Noto Sans", Arial, sans-serif;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(7,11,20,0) 38%, rgba(7,11,20,0.35) 52%, rgba(7,11,20,0.82) 68%, rgba(7,11,20,0.92) 100%);
    }
    .copy {
      position: absolute;
      top: 56px;
      right: 48px;
      width: 500px;
      z-index: 2;
      text-align: right;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .mark {
      width: 48px; height: 48px; border-radius: 12px;
      background: #F0B90B; color: #0B0F19;
      font-weight: 800; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .brand b {
      color: #fff;
      font-size: 28px;
      letter-spacing: 0.18em;
      text-shadow: 0 3px 0 #000, 0 8px 18px rgba(0,0,0,.55);
    }
    .kicker {
      color: #F0B90B;
      font-weight: 800;
      letter-spacing: 0.14em;
      font-size: 20px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #000;
      margin-bottom: 8px;
    }
    .title {
      margin: 0 0 6px;
      font-size: 54px;
      line-height: 0.9;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      text-shadow:
        0 3px 0 #0B0F19,
        0 8px 0 #7a5a00,
        0 16px 28px rgba(0,0,0,.55);
    }
    .title em {
      display: block;
      font-style: normal;
      font-size: 86px;
      color: #F0B90B;
      -webkit-text-stroke: 6px #0B0F19;
      paint-order: stroke fill;
      text-shadow: 0 10px 0 #8a6400, 0 18px 30px rgba(0,0,0,.5);
    }
    .stack { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(90deg, #162235, #0B0F19);
      border: 3px solid #F0B90B;
      border-radius: 14px;
      padding: 12px 18px 12px 20px;
      box-shadow: 0 8px 0 #6b5200, 0 16px 24px rgba(0,0,0,.4);
      clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    }
    .row .term {
      color: #fff;
      font-weight: 800;
      font-size: 26px;
      text-shadow: 0 2px 0 #000;
    }
    .row .amt {
      color: #F0B90B;
      font-weight: 900;
      font-size: 34px;
      letter-spacing: -0.02em;
      text-shadow: 0 3px 0 #000;
    }
    .row.best {
      background: linear-gradient(90deg, #F0B90B, #FCD535);
      border-color: #fff;
      box-shadow: 0 8px 0 #8a6400, 0 16px 24px rgba(0,0,0,.45);
    }
    .row.best .term, .row.best .amt { color: #0B0F19; text-shadow: none; }
    .row.best .amt { font-size: 38px; }
    .ai {
      margin-top: 16px;
      color: #FCD535;
      font-weight: 800;
      font-size: 22px;
      text-shadow: 0 3px 0 #000;
    }
    .foot {
      position: absolute;
      left: 36px; right: 36px; bottom: 28px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 3px 8px #000;
    }
    .foot span { text-align: center; flex: 1; }
    .foot small { display: block; color: #F0B90B; font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="art">
    <div class="scrim"></div>
    <div class="copy">
      <div class="brand"><div class="mark">R</div><b>REED</b></div>
      <div class="kicker">Grade 10 · 11 · 12</div>
      <h1 class="title">All subjects<br><em>ONE PACK</em></h1>
      <div class="stack">
        <div class="row"><span class="term">1 month</span><span class="amt">9,500 Ks</span></div>
        <div class="row"><span class="term">3 months</span><span class="amt">19,500 Ks</span></div>
        <div class="row"><span class="term">6 months</span><span class="amt">29,500 Ks</span></div>
        <div class="row best"><span class="term">13 months</span><span class="amt">34,500 Ks</span></div>
      </div>
      <div class="ai">Weekly timetable made by AI</div>
    </div>
    <div class="foot">
      <span>Bot<small>@reededucation_bot</small></span>
      <span>Buy<small>@minaphayarkot</small></span>
      <span>Channel<small>@REED_education</small></span>
    </div>
  </div>
</body>
</html>
